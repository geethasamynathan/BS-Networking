<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430"><rect width="100%" height="100%" fill="#f8fafc"/><text x="550" y="43" font-size="26" text-anchor="middle" font-weight="bold" font-family="Arial">Port 5000 — Before and After Firewall Rule</text><rect x="45" y="100" width="460" height="100" rx="12" fill="#fee2e2" stroke="#c95f5f" stroke-width="2"/><text x="275.0" y="128" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#1e293b">BEFORE</text><text x="275.0" y="153" text-anchor="middle" font-family="Arial" font-size="14" fill="#334155">AWS security group has no inbound TCP 5000</text><rect x="595" y="100" width="460" height="100" rx="12" fill="#dcfce7" stroke="#5eaa79" stroke-width="2"/><text x="825.0" y="128" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#1e293b">AFTER</text><text x="825.0" y="153" text-anchor="middle" font-family="Arial" font-size="14" fill="#334155">Custom TCP 5000 → My IP is added</text><rect x="45" y="275" width="460" height="100" rx="12" fill="#fff5f5" stroke="#c95f5f" stroke-width="2"/><text x="275.0" y="303" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#1e293b">Remote laptop: Connection fails</text><text x="275.0" y="328" text-anchor="middle" font-family="Arial" font-size="14" fill="#334155">Local IIS site still works</text><rect x="595" y="275" width="460" height="100" rx="12" fill="#effbf2" stroke="#5eaa79" stroke-width="2"/><text x="825.0" y="303" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#1e293b">Remote laptop: Page opens</text><text x="825.0" y="328" text-anchor="middle" font-family="Arial" font-size="14" fill="#334155">Authorized source reaches the IIS site</text><path d="M275 200 L275 275" stroke="#bf4d4d" stroke-width="3" fill="none"/><text x="275.0" y="227.5" text-anchor="middle" font-family="Arial" font-size="13" fill="#bf4d4d">BLOCKED</text><path d="M825 200 L825 275" stroke="#2e945b" stroke-width="3" fill="none"/><text x="825.0" y="227.5" text-anchor="middle" font-family="Arial" font-size="13" fill="#2e945b">ALLOWED</text></svg>